spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: patient-service
          uri: http://patient-service:8080
          predicates:
            - Path=/api/v1/**
          filters:
            - StripPrefix=0
            - AddRequestHeader=X-Gateway,ApiGateway
            - AddResponseHeader=X-Content-Type-Options,nosniff
            - AddResponseHeader=X-Frame-Options,DENY
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: false
            maxAge: 3600

server:
  port: ${SERVER_PORT:4000}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO
