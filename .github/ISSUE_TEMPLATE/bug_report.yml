name: Bug report
description: Report a service bug
labels: [bug]
body:
  - type: input
    id: service
    attributes:
      label: Service
      placeholder: e.g., patient-service
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / stacktrace
